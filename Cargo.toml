[workspace]
resolver = "2"
members = ["crates/vedit-core", "crates/vedit-gui"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
authors = ["VEDIT contributors"]
repository = "https://github.com/your-org/vedit"

[workspace.dependencies]
vedit-core = { path = "crates/vedit-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico"] }
eframe = { version = "=0.29.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
rfd = "0.15"
open = "5"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# NOTE: `panic = "abort"` was removed — with it, ANY panic in ANY background
# thread (preview engine, audio, thumbnails) instantly killed the whole app.
# With unwinding, a panicking helper thread only kills itself and the panic
# hook logs it to vedit-panic.log next to the executable.
